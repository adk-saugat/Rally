services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_postgres:
